[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waveeee-image-mcp"
version = "0.4.2"
description = "MCP stdio server for Waveeee image generation, editing and response saving"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["waveeee_image_mcp*"]
