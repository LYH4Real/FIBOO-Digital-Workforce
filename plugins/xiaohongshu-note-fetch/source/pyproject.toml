[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-note-fetcher"
version = "0.2.0"
description = "Extract Xiaohongshu note details from complete share links"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
mcp = ["mcp>=1.20,<2"]

[project.scripts]
xhs-note = "xhs_note_fetcher.cli:main"
xhs-note-mcp = "xhs_note_fetcher.mcp_server:main"

[tool.setuptools.packages.find]
include = ["xhs_note_fetcher*"]
