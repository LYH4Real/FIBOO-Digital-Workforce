name: Validate marketplace
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/release.py validate
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s plugins/fiboo-product-materials/skills/fiboo-product-materials/tests -v
      - run: python -m unittest discover -s plugins/xiaohongshu-content-planner/skills/xiaohongshu-content-planner/tests -v
      - shell: powershell
        run: |
          & ./plugins/wave-image/scripts/check.ps1
          & ./plugins/xiaohongshu-note-fetch/scripts/check.ps1
